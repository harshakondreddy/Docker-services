# No namespace is set here on purpose: pass it at apply time, e.g.
#   kubectl apply -n <namespace> -f ollama-gemma3-4b.yaml
# so `kubectl delete -f` removes only the Ollama resources.
# The PVC uses the cluster's default StorageClass; uncomment
# storageClassName below to pick a specific one.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-gemma3-4b-data
spec:
  accessModes:
    - ReadWriteOnce
  # storageClassName: <your-storage-class>
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-gemma3-4b
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama-gemma3-4b
  template:
    metadata:
      labels:
        app: ollama-gemma3-4b
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      initContainers:
        - name: pull-model
          image: ollama/ollama:0.30.7
          imagePullPolicy: IfNotPresent
          env:
            - name: OLLAMA_HOST
              value: 127.0.0.1:11434
          command:
            - /bin/sh
            - -c
          args:
            - |
              ollama serve >/tmp/ollama-init.log 2>&1 &
              pid=$!
              trap 'kill $pid; wait $pid || true' EXIT
              until ollama list >/dev/null 2>&1; do sleep 2; done
              ollama pull gemma3:4b
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      containers:
        - name: ollama-gemma3-4b
          image: ollama/ollama:0.30.7
          imagePullPolicy: IfNotPresent
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:18080
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
          command:
            - ollama
            - serve
          ports:
            - name: http
              containerPort: 18080
          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "2"
              memory: "6Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-gemma3-4b-data
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-gemma3-4b
spec:
  type: NodePort
  selector:
    app: ollama-gemma3-4b
  ports:
    - name: http
      port: 18080
      targetPort: http
      nodePort: 32080
